# IMPORTANT: Replace placeholder values with base64-encoded real secrets before deploying.
# Generate: echo -n 'your-secret' | base64
# Apply:     kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mapforge-secrets
  namespace: mapforge
type: Opaque
data:
  SECRET_KEY: ""        # base64(your-jwt-secret, min 32 chars)
  DATABASE_URL: ""      # base64(postgresql+asyncpg://user:pass@host:5432/mapforge)
  STRIPE_SECRET_KEY: "" # base64(sk_live_...)
  STRIPE_WEBHOOK_SECRET: "" # base64(whsec_...)
