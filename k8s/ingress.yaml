apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mapforge
  namespace: mapforge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  rules:
    - host: mapforge.example.com   # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mapforge
                port:
                  number: 80
  tls:
    - hosts:
        - mapforge.example.com
      secretName: mapforge-tls
