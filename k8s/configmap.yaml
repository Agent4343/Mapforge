apiVersion: v1
kind: ConfigMap
metadata:
  name: mapforge-config
  namespace: mapforge
data:
  PORT: "8000"
  STORAGE_BACKEND: "local"
  # NOTE: /tmp is ephemeral and not shared across pods. For multi-replica
  # production deployments use a PersistentVolume or set STORAGE_BACKEND=s3.
  STORAGE_LOCAL_PATH: "/tmp/mapforge_storage"
  PYTHONUNBUFFERED: "1"
