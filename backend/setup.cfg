[flake8]
max-line-length = 120
# E501 is superseded by max-line-length; E302/E303/E305 spacing; E402 module-level
# import ordering (intentional in config.py / auth.py); E711/E712 SQLAlchemy idioms
# (== True / == False are idiomatic in SQLAlchemy filter expressions);
# F401 unused imports are cleaned up incrementally; F541 f-string without
# placeholder; F811 redefinition (intentional override pattern in auth router).
extend-ignore =
    E127,
    E128,
    E203,
    E231,
    E261,
    E272,
    E302,
    E303,
    E305,
    E402,
    E501,
    E701,
    E711,
    E712,
    E731,
    F401,
    F541,
    F811,
    F841
