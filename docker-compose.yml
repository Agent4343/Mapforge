services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=/tmp/mapforge_storage
    env_file:
      - ./backend/.env
    volumes:
      - mapforge_storage:/tmp/mapforge_storage

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000/
    depends_on:
      - backend

volumes:
  mapforge_storage:
